spring.application.name=smart-wallet

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# The pooled DB connection (PgBouncer in transaction mode) doesn't preserve server-side
# prepared statements across reused connections, causing "prepared statement already
# exists" errors. Disabling them makes pgjdbc always send simple/unnamed statements.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

api.security.token.secret=${JWT_SECRET}

app.cors.allowed-origins=${FRONTEND_URL}

google.oauth.client-id=${GOOGLE_CLIENT_ID}